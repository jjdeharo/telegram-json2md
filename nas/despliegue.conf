# Cómo se despliega en el NAS, para `desplegar-nas` (repositorio vigilancia-nas, ADR 0011).
DESTINO=/volume1/docker/memoria-telegram
COPIAR="nas/compose.yml nas/Dockerfile nas/bucle.sh nas/clonar-repos.sh"
# bucle.sh va dentro de la imagen; los scripts se leen en cada pasada y no piden reinicio.
CONSTRUIR_SI="nas/Dockerfile nas/bucle.sh"
OCUPADO="memoria-telegram"
# Dónde cuentan sus reparadores lo que cambian; el vigía lo cita al subir el arreglo (ADR 0012).
BITACORA=docs/reparaciones.md
