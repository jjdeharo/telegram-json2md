# La memoria de Telegram, corriendo en el NAS.
#
#   docker compose up -d --build     construir y arrancar
#   docker compose logs -f           ver el bucle
#   docker exec -it memoria-telegram bash    entrar a operar a mano
#
# Nada de lo que importa vive dentro del contenedor: el repositorio, los datos,
# las conversaciones y las tres sesiones —Telegram, NotebookLM y Claude— están
# en los volúmenes de abajo, en /volume1/docker/memoria-telegram.
services:
  memoria-telegram:
    # La versión de Claude Code sale del archivo común del NAS
    # (/volume1/docker/versiones/versiones.env, enlazado aquí como .env), que el
    # actualizador semanal de vigilancia mantiene al día. Si falta, se usa la
    # que trae el Dockerfile.
    build:
      context: .
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-}
    image: memoria-telegram:local
    container_name: memoria-telegram
    restart: unless-stopped
    user: "1000:10"
    environment:
      TZ: Europe/Madrid
      HOME: /home/jjdeharo
    volumes:
      # El repositorio, con sus datos dentro (datos/, salida/, sesion/,
      # registro/, material/, config.json y estado.json). Es lo que se copia del
      # portátil y lo único que hay que respaldar.
      - ./repo:/proyecto
      # Los repositorios de eXeLearning y su ecosistema, que el sincronizador
      # lee con `git show`. Se clonan una vez y se actualizan solos.
      - ./repos:/repos
      # El home persistente: aquí viven las cookies de NotebookLM (~/.notebooklm)
      # y la sesión de Claude (~/.claude). Sin esto habría que volver a
      # autorizar en cada reconstrucción de la imagen.
      - ./home:/home/jjdeharo
